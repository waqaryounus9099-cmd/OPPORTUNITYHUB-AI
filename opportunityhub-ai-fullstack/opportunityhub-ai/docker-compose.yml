services:
  postgres:
    image: postgres:16-alpine
    container_name: opportunityhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opportunityhub
      POSTGRES_PASSWORD: opportunityhub_dev
      POSTGRES_DB: opportunityhub
    ports:
      - "5432:5432"
    volumes:
      - opportunityhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunityhub -d opportunityhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opportunityhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - opportunityhub_redisdata:/data

volumes:
  opportunityhub_pgdata:
  opportunityhub_redisdata:
